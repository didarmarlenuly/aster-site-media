<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{
  --bg:#F2F4F8;          
  --surface:#FFFFFF;
  --surface-2:#E7EBF2;
  --ink:#0E1A33;         
  --text:#2A3550;
  --muted:#5E6A84;
  --line:#D5DBE6;
  --brand:#1F3561;       
  --brand-soft:#E3E9F5;
  --rack:#E8612C;        
  --rack-ink:#FFFFFF;
  --led:#FF3B30;         
  --ok:#1E8E5A;
  --warn:#C9561B;
  --band:#0E1A33;        
  --band-text:#E6EAF2;
  --band-muted:#9AA6BF;
  --band-line:#24324F;
  --draft:#B7791F;
  --draft-bg:#FFF6E5;
  --font-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --r:10px;
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --surface:#111A2E; --surface-2:#18233B; --ink:#EEF2F9; --text:#C9D1E1; --muted:#8C98B2;
    --line:#22304C; --brand:#8FB0EE; --brand-soft:#1A2744; --rack:#FF7A45; --rack-ink:#140A04; --led:#FF453A;
    --ok:#4CC38A; --warn:#FF9A5C; --band:#060B16; --band-text:#E6EAF2; --band-muted:#8C98B2; --band-line:#1C2740;
    --draft:#F2B84B; --draft-bg:#2A2110; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111A2E; --surface-2:#18233B; --ink:#EEF2F9; --text:#C9D1E1; --muted:#8C98B2;
  --line:#22304C; --brand:#8FB0EE; --brand-soft:#1A2744; --rack:#FF7A45; --rack-ink:#140A04; --led:#FF453A;
  --ok:#4CC38A; --warn:#FF9A5C; --band:#060B16; --band-text:#E6EAF2; --band-muted:#8C98B2; --band-line:#1C2740;
  --draft:#F2B84B; --draft-bg:#2A2110; color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.ap *{box-sizing:border-box}
.ap{overflow-x:clip}
.ap a{color:inherit}
.ap h1,.ap h2,.ap h3{font-family:var(--font-display);color:var(--ink);text-wrap:balance;margin:0}
.ap p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-family:var(--font-label);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--muted)}
.num{font-family:var(--font-label);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:8px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid transparent;transition:transform .15s ease,background .15s ease;cursor:pointer;font-family:var(--font-body)}
.btn:focus-visible,.ap a:focus-visible,.ap input:focus-visible,.ap select:focus-visible,.ap textarea:focus-visible,.ap summary:focus-visible{outline:3px solid var(--rack);outline-offset:2px}
.btn-primary{background:var(--rack);color:var(--rack-ink)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--brand)}
.draft{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--draft);background:var(--draft-bg);color:var(--draft);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;line-height:1.5}
.devbar{background:var(--draft-bg);border-bottom:1px solid var(--line);color:var(--text);font-size:13.5px}
.devbar .wrap{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-block:8px}
.devbar b{color:var(--draft)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;padding-block:12px}
.logo{display:block;width:118px;color:var(--brand);flex:none}
.logo svg{display:block;width:100%;height:auto}
.nav{display:flex;gap:22px;margin-left:auto}
.nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--text)}
.nav a:hover{color:var(--brand)}
.top .btn{padding:10px 16px;font-size:14px}
@media (max-width:900px){.nav{display:none}.top .btn{margin-left:auto}}
.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:center}
.hero h1{font-size:clamp(32px,4.4vw,54px);line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--rack)}
.hero .lead{font-size:clamp(17px,1.6vw,19px);margin-top:20px;color:var(--text)}
@media (min-width:760px){.hero .lead{text-align:justify;-webkit-hyphens:auto;hyphens:auto}}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.door{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .15s}
.door:hover{border-color:var(--brand)}
.door b{display:block;color:var(--ink);font-size:17px}
.door span{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.door .label{display:block;margin-bottom:6px;color:var(--rack)}
.reel{position:relative;justify-self:end;width:100%;max-width:330px;aspect-ratio:478/850;border-radius:14px;overflow:hidden;background:var(--band);box-shadow:0 30px 60px -30px rgba(14,26,51,.55)}
.reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .tag{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(6,11,22,.78);color:#E6EAF2;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4}
.reel .tag .label{color:#FFB08A;font-size:13px}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.reel{justify-self:start;max-width:300px}.doors{grid-template-columns:1fr}}
.proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.proof .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:0}
.proof .cell{padding:20px 16px 18px;border-left:1px solid var(--line);min-width:0}
.proof .cell:first-child{border-left:0;padding-left:0}
.proof .num{font-size:clamp(30px,3.4vw,42px);color:var(--ink);line-height:1}
.proof p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
@media (max-width:900px){.proof .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.proof .cell{border-left:0;border-top:1px solid var(--line);padding-left:0}.proof .cell:nth-child(-n+2){border-top:0}}
.sec{padding-block:88px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sec-head h2{font-size:clamp(28px,3.6vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.015em}
.sec-head p{font-size:18px}
@media (min-width:760px){.sec-head p,.dash-head p{text-align:justify;-webkit-hyphens:auto;hyphens:auto}}
.zone{display:flex;align-items:center;gap:10px}
.zone::before{content:"";width:22px;height:4px;background:var(--rack);border-radius:2px}
.bpm-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;margin-top:44px;align-items:start}
@media (max-width:980px){.bpm-grid{grid-template-columns:1fr}}
.window{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 50px -36px rgba(14,26,51,.45)}
.win-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted)}
.win-bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.win-bar .sp{margin-left:auto}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;padding:14px;overflow-x:auto}
.col{min-width:0}
.col h4{margin:0 0 8px;font:600 13px var(--font-body);color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.35}
.card b{display:block;color:var(--ink);font-weight:700;margin-bottom:6px}
.card .meta{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.ai{padding:16px;display:grid;gap:10px;border-top:1px solid var(--line)}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.msg.me{justify-self:end;background:var(--brand);color:var(--surface);border-bottom-right-radius:4px}
.msg.bot{background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px}
.msg.bot .num{font-size:20px;color:var(--ink)}
.kpis{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}
.kpis div{min-width:0}
.kpis small{display:block;color:var(--muted);font-size:12px}
.example{font-size:12.5px;color:var(--muted);padding:8px 16px 14px}
.why{display:grid;gap:14px}
.why .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.why .item b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.why .item p{font-size:15px;color:var(--text)}
.everywhere{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.everywhere span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--bg);color:var(--ink);font-weight:600}
.mods{margin-top:44px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

@media (max-width:520px){.mods{grid-template-columns:1fr}}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.mod .label{display:flex;justify-content:space-between;color:var(--brand)}
.mod ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:15px;color:var(--ink)}
.mods-note{margin-top:14px;color:var(--muted);font-size:15px}
.tasks{margin-top:44px}
.tk-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}

.tk-sel{font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);white-space:nowrap}

.tk-btn{font-size:12.5px;font-weight:700;border-radius:8px;padding:5px 12px;border:1px solid var(--line);color:var(--ink);background:var(--surface);white-space:nowrap}
.tk-btn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.tk-body{display:grid;grid-template-columns:184px minmax(0,1fr);gap:12px;padding:14px}
.tk-people{border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start}
.tk-people h5{margin:2px 4px 8px;font:700 12.5px var(--font-body);color:var(--ink);display:flex;justify-content:space-between}
.tk-people h5 span{color:var(--muted);font-weight:600}
.tk-people ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tk-people li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text);padding:6px 8px;border-radius:7px}
.tk-people li span{color:var(--muted)}
.tk-people li.on{background:var(--brand-soft);color:var(--brand);font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 35%,transparent)}
.tk-main{min-width:0}
.tk-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tk-week>div{border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;background:var(--surface)}
.tk-week small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.tk-week b{display:block;font-family:var(--font-label);font-size:19px;color:var(--ink);line-height:1.15}
.tk-week .dots{display:flex;gap:3px;height:6px}
.tk-week .dots i{width:5px;height:5px;border-radius:50%}
.tk-week .today{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.d-wait,.tk-col.wait h6 i{background:var(--muted)}
.d-work,.tk-col.work h6 i{background:var(--brand)}
.d-check,.tk-col.check h6 i{background:#7A5AF8}
.d-fix,.tk-col.fix h6 i{background:var(--rack)}
.tk-col.done h6 i{background:var(--ok)}
.tk-cols{display:grid;grid-template-columns:repeat(5,minmax(164px,1fr));gap:8px;overflow-x:auto;overscroll-behavior-x:contain}
.tk-col{background:var(--surface-2);border-radius:10px;padding:8px;min-width:0}

.tk-col h6 span{color:var(--muted);font-weight:600}
.tk-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;line-height:1.35}

.tk-flag{flex:none;color:var(--rack);margin-top:2px}
.tk-card .ty{display:block;color:var(--muted);font-size:11px}
.tk-card .cm{display:flex;gap:6px;align-items:flex-start;margin-top:7px;background:var(--bg);border-radius:6px;padding:5px 7px;font-size:11px;color:var(--text)}
.tk-card .cm svg{flex:none;margin-top:2px;color:var(--muted)}
.tk-card .cm.w{background:color-mix(in srgb,var(--rack) 12%,var(--surface))}
.tk-card .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.tk-ava{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.tk-due{text-align:right;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap}
.tk-due svg{vertical-align:-1px}
.tk-due small{display:block;font-size:10.5px;font-weight:600;color:#C2332B}
.tk-due.late{color:#C2332B}
.tk-due.ok{color:var(--ok)}
:root[data-theme="dark"] .tk-due.late,:root[data-theme="dark"] .tk-due small{color:#FF7A70}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tk-due.late,:root:not([data-theme="light"]) .tk-due small{color:#FF7A70}}
.tk-more{display:block;text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0 3px}
.why-row{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}
@media (max-width:980px){.why-row{grid-template-columns:1fr}}
@media (max-width:900px){.tk-body{grid-template-columns:1fr}.tk-people{display:none}.tk-date,.tk-exp{display:none}}
@media (max-width:620px){.tk-cols{grid-template-columns:repeat(5,208px)}.tk-week{grid-template-columns:repeat(7,58px);overflow-x:auto}.tasks .win-bar i{display:none}.tk-right{margin-left:0}}
.dash{margin-top:56px}
.dash-head{display:grid;gap:12px}
.dash-head h3{font-size:clamp(24px,2.8vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
.dash-head p{font-size:17px}
.dash-win{margin-top:24px}
.dash-win .win-bar .chip{font-weight:600;white-space:nowrap}
.kc-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px}
@media (max-width:1100px){.kc-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.kc-row{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}.kc{scroll-snap-align:start}}
.kc{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}

.ring span{position:relative;font-family:var(--font-label);font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
